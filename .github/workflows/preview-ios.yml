name: Preview native iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-ios.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build app for iPhone Simulator
        run: |
          set -euo pipefail
          mkdir -p preview
          xcodebuild build \
            -project PocketTest.xcodeproj \
            -scheme PocketTest \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            2>&1 | tee preview/simulator-build.log
      - name: Run native app and capture screenshot
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > preview/devices.json
          device_id=$(python3 -c 'import json; d=json.load(open("preview/devices.json")); candidates=[(r,x) for r,items in d["devices"].items() if ".iOS-" in r for x in items if x["name"].startswith("iPhone")]; candidates.sort(key=lambda x:(x[0],x[1]["name"]=="iPhone 16"),reverse=True); assert candidates, "No available iPhone simulator"; print(candidates[0][1]["udid"])')
          printf '%s\n' "$device_id" > preview/device-id.txt
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl ui "$device_id" appearance light
          xcrun simctl install "$device_id" build/simulator/Build/Products/Release-iphonesimulator/PocketTest.app
          xcrun simctl launch "$device_id" io.pockettest.native.smoke -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN | tee preview/launch.log
          sleep 5
          xcrun simctl io "$device_id" screenshot preview/PocketTest-iPhone.png
      - name: Upload native preview and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketTest-native-preview
          path: preview/*
          if-no-files-found: error
          retention-days: 3
