name: Build SideStore C gateway test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sidestore-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: d97ec133719d79916675bdaf722b82a8d091d545
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'

      - name: Install official build tools
        run: brew install ldid xcbeautify

      - name: Build only the libimobiledevice gateway
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, expected=1):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != expected:
                  raise RuntimeError(f"Unexpected upstream source in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "Dependencies/minimuxer/Package.swift",
              '                .product(name: "IdeviceGateway", package: "DeviceGateway"),\n',
              ""
          )
          replace_once(
              "Dependencies/minimuxer/Sources/MinimuxerApi.swift",
              "import IdeviceGateway\n",
              ""
          )
          replace_once(
              "Dependencies/minimuxer/Sources/MinimuxerApi.swift",
              """        switch backend {
                      case .libimobiledevice:
                          return LibimobiledeviceGateway()
                      case .idevice:
                          return IdeviceGateway()
                  }""",
              """        // This personal test build omits Rust FFI to avoid colliding C exports.
                  // The legacy setting still loads; device renewal needs proper testing.
                  return LibimobiledeviceGateway()"""
          )
          replace_once(
              "Dependencies/minimuxer/Sources/MinimuxerApi.swift",
              "private static var currentBackend: GatewayBackend = .idevice",
              "private static var currentBackend: GatewayBackend = .libimobiledevice"
          )
          replace_once(
              "AltStore/Core/Extensions/UserDefaults+AltStore.swift",
              "GatewayBackend.idevice.rawValue",
              "GatewayBackend.libimobiledevice.rawValue",
              expected=2
          )
          replace_once(
              "Dependencies/minimuxer/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift",
              "let sErr = lockdownd_start_service(lockdown, service.rawValue, &serviceDescriptor)",
              '''// Lockdown uses the traditional misagent name, not the RSD shim name.
                      let serviceName = service == .misagent ? "com.apple.misagent" : service.rawValue
                      let sErr = lockdownd_start_service(lockdown, serviceName, &serviceDescriptor)'''
          )
          replace_once(
              "Dependencies/minimuxer/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift",
              r'''throw LibimobiledeviceGatewayError(.serviceError, reason: "Failed to start lockdown service '\(service.rawValue)': code \(sErr.rawValue)")''',
              r'''throw LibimobiledeviceGatewayError(.serviceError, reason: "Failed to start lockdown service '\(serviceName)': code \(sErr.rawValue)")'''
          )
          replace_once('Dependencies/minimuxer/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift', '    func syncInstallProvisioningProfile(profile: Data) throws {\n        if pairingFileType == .rppairing {\n            try withRSDService(.misagent) { stream in\n                debugLog("[LibimobiledeviceGateway] Installing provisioning profile via RSD misagent...")\n                try rsdSendPlist(stream, dict: ["MessageType": "Install", "Profile": profile])\n                let resp = try rsdRecvPlist(stream)\n                if let status = resp["Status"] as? Int, status != 0 {\n                    throw LibimobiledeviceGatewayError(.serviceError, reason: "misagent install failed with status: \\(status)")\n                }\n                debugLog("[LibimobiledeviceGateway] Provisioning profile installed successfully via RSD!")\n            }\n            return\n        }\n\n        try withService(\n            service: .misagent,\n            create: misagent_client_new,\n            cleanup: misagent_client_free\n        ) { misagent in\n            try profile.withUnsafeBytes { profBuf in\n                guard let profPtr = profBuf.baseAddress?.assumingMemoryBound(to: CChar.self) else {\n                    throw LibimobiledeviceGatewayError(.serviceError, reason: "Invalid profile buffer")\n                }\n                let plistProfile = plist_new_data(profPtr, UInt64(profile.count))\n                defer { if let p = plistProfile { plist_free(p) } }\n\n                let res = misagent_install(misagent, plistProfile)\n                if res != MISAGENT_E_SUCCESS {\n                    throw LibimobiledeviceGatewayError(.serviceError, reason: "misagent_install failed with code \\(res.rawValue)")\n                }\n            }\n        }\n    }\n\n', '    // Lockdown compatibility path. Keep the parent and heartbeat connections alive\n    // for this transaction, and check TLS instead of the C service constructor\n    // (which discards service_enable_ssl failures in the pinned library).\n    private func withCheckedProfileService<T>(\n        device: idevice_t,\n        lockdown: lockdownd_client_t,\n        name: String,\n        escrow: Bool = false,\n        _ body: (idevice_connection_t) throws -> T\n    ) throws -> T {\n        var descriptor: lockdownd_service_descriptor_t? = nil\n        let started = escrow\n            ? lockdownd_start_service_with_escrow_bag(lockdown, name, &descriptor)\n            : lockdownd_start_service(lockdown, name, &descriptor)\n        guard started == LOCKDOWN_E_SUCCESS, let descriptor else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "Profile service start failed (\\(name)): code \\(started.rawValue)")\n        }\n        defer { lockdownd_service_descriptor_free(descriptor) }\n        var connection: idevice_connection_t? = nil\n        let connected = idevice_connect(device, descriptor.pointee.port, &connection)\n        guard connected == IDEVICE_E_SUCCESS, let connection else {\n            throw LibimobiledeviceGatewayError(.connectionFailed, reason: "Profile service TCP connect failed (\\(name)): code \\(connected.rawValue)")\n        }\n        defer { _ = idevice_disconnect(connection) }\n        if descriptor.pointee.ssl_enabled != 0 {\n            let tls = idevice_connection_enable_ssl(connection)\n            guard tls == IDEVICE_E_SUCCESS else {\n                // Only report error codes; never log keys, pairing records or profiles.\n                throw LibimobiledeviceGatewayError(.connectionFailed, reason: "Profile service TLS handshake failed (\\(name)): code \\(tls.rawValue)")\n            }\n        }\n        debugLog("[ProfileService] \\(name): authenticated transport ready")\n        return try body(connection)\n    }\n\n    private func sendProfileMessage(\n        _ message: [String: Any], on connection: idevice_connection_t, stage: String\n    ) throws {\n        let payload = try PropertyListSerialization.data(fromPropertyList: message, format: .xml, options: 0)\n        guard payload.count <= 16 * 1024 * 1024 else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "\\(stage): outgoing frame exceeds size limit")\n        }\n        var length = UInt32(payload.count).bigEndian\n        var frame = withUnsafeBytes(of: &length) { Data($0) }\n        frame.append(payload)\n        var offset = 0\n        while offset < frame.count {\n            var sent: UInt32 = 0\n            let remaining = frame.count - offset\n            let result = frame.withUnsafeBytes { buffer in\n                idevice_connection_send(connection, buffer.baseAddress!.advanced(by: offset).assumingMemoryBound(to: CChar.self), UInt32(remaining), &sent)\n            }\n            guard result == IDEVICE_E_SUCCESS, sent > 0, Int(sent) <= remaining else {\n                throw LibimobiledeviceGatewayError(.connectionFailed, reason: "\\(stage): send failed, code \\(result.rawValue), bytes \\(offset)/\\(frame.count)")\n            }\n            offset += Int(sent)\n        }\n    }\n\n    private func receiveProfileMessage(\n        on connection: idevice_connection_t, stage: String, timeout: UInt32 = 5000\n    ) throws -> [String: Any] {\n        // One deadline covers the complete header and payload.\n        let deadline = Date().addingTimeInterval(Double(timeout) / 1000)\n        func exact(_ count: Int, part: String) throws -> Data {\n            var bytes = [UInt8](repeating: 0, count: count)\n            var offset = 0\n            while offset < count {\n                let remainingTime = deadline.timeIntervalSinceNow\n                guard remainingTime > 0 else {\n                    throw LibimobiledeviceGatewayError(.connectionFailed, reason: "\\(stage): \\(part) timed out")\n                }\n                var received: UInt32 = 0\n                let remaining = count - offset\n                let milliseconds = UInt32(max(1, min(5000, remainingTime * 1000)))\n                let result = bytes.withUnsafeMutableBytes { buffer in\n                    idevice_connection_receive_timeout(connection, buffer.baseAddress!.advanced(by: offset).assumingMemoryBound(to: CChar.self), UInt32(remaining), &received, milliseconds)\n                }\n                guard result == IDEVICE_E_SUCCESS, received > 0, Int(received) <= remaining else {\n                    throw LibimobiledeviceGatewayError(.connectionFailed, reason: "\\(stage): \\(part) receive failed, code \\(result.rawValue), bytes \\(offset)/\\(count)")\n                }\n                offset += Int(received)\n            }\n            return Data(bytes)\n        }\n        let header = try exact(4, part: "header")\n        let length = header.reduce(UInt32(0)) { ($0 << 8) | UInt32($1) }\n        guard length > 0, length <= 16 * 1024 * 1024 else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "\\(stage): invalid response frame length")\n        }\n        let payload = try exact(Int(length), part: "payload")\n        guard let response = try PropertyListSerialization.propertyList(from: payload, options: [], format: nil) as? [String: Any] else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "\\(stage): response is not a dictionary")\n        }\n        return response\n    }\n\n    private func verifyProfileResponse(_ response: [String: Any], stage: String) throws {\n        guard let status = response["Status"] as? NSNumber else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "\\(stage): response has no numeric Status")\n        }\n        guard status.int64Value == 0 else {\n            throw LibimobiledeviceGatewayError(.serviceError, reason: "\\(stage): device returned status \\(status.int64Value)")\n        }\n    }\n\n    func syncInstallProvisioningProfile(profile: Data) throws {\n        if pairingFileType == .rppairing {\n            try withRSDService(.misagent) { stream in\n                debugLog("[LibimobiledeviceGateway] Installing provisioning profile via RSD misagent...")\n                try rsdSendPlist(stream, dict: ["MessageType": "Install", "Profile": profile])\n                let resp = try rsdRecvPlist(stream)\n                if let status = resp["Status"] as? Int, status != 0 {\n                    throw LibimobiledeviceGatewayError(.serviceError, reason: "misagent install failed with status: \\(status)")\n                }\n                debugLog("[LibimobiledeviceGateway] Provisioning profile installed successfully via RSD!")\n            }\n            return\n        }\n\n        try withLockdown { device, lockdown in\n            try withCheckedProfileService(device: device, lockdown: lockdown, name: "com.apple.mobile.heartbeat") { heartbeat in\n                let marco = try receiveProfileMessage(on: heartbeat, stage: "heartbeat Marco")\n                guard marco["Command"] as? String == "Marco" else {\n                    throw LibimobiledeviceGatewayError(.serviceError, reason: "heartbeat: expected Marco")\n                }\n                try sendProfileMessage(["Command": "Polo"], on: heartbeat, stage: "heartbeat Polo")\n                debugLog("[ProfileService] Marco/Polo completed; heartbeat and Lockdown retained during profile transaction")\n\n                // Stay within the first heartbeat interval; this is a short profile\n                // transaction, not an always-on background heartbeat service.\n                let interval = (marco["Interval"] as? NSNumber)?.doubleValue ?? 10\n                let transactionStart = Date()\n                let escrow = (self.pairingDataDict?["EscrowBag"] as? Data)?.isEmpty == false\n                try withCheckedProfileService(device: device, lockdown: lockdown, name: "com.apple.misagent", escrow: escrow) { misagent in\n                    try sendProfileMessage(["MessageType": "CopyAll", "ProfileType": "Provisioning"], on: misagent, stage: "misagent preflight")\n                    let preflight = try receiveProfileMessage(on: misagent, stage: "misagent preflight")\n                    try verifyProfileResponse(preflight, stage: "misagent preflight")\n                    guard preflight["Payload"] is [Data] else {\n                        throw LibimobiledeviceGatewayError(.serviceError, reason: "misagent preflight: missing profile array")\n                    }\n                    debugLog("[ProfileService] read-only misagent preflight succeeded")\n                    guard Date().timeIntervalSince(transactionStart) < max(1, interval - 2) else {\n                        throw LibimobiledeviceGatewayError(.connectionFailed, reason: "misagent preflight exceeded heartbeat window; no profile installation attempted")\n                    }\n                    try sendProfileMessage(["MessageType": "Install", "ProfileType": "Provisioning", "Profile": profile], on: misagent, stage: "misagent install")\n                    let response = try receiveProfileMessage(on: misagent, stage: "misagent install")\n                    try verifyProfileResponse(response, stage: "misagent install")\n                    debugLog("[ProfileService] misagent install acknowledged by device")\n                }\n            }\n        }\n    }\n\n\n')
          replace_once('Dependencies/minimuxer/Sources/MinimuxerImpl.swift', '        // check connection status first\n        if withNetworkCheck && !(\n            self.network.isWifiSatisfied   /* ||\n            self.network.isWiredSatisfied     ||\n            self.network.isUsbSatisfied       ||\n            self.network.isBridgeSatisfied */\n        ){\n            debugLog("[minimuxer] minimuxer not ready: no network connection")\n            return .failure(.noConnection("No wifi interface satisfied"))\n        }\n\n        // check connection mode\n        let connectionMode = await getConnectionMode()', '        // Cellular is eligible only for the configured on-device VPN path.\n        // Peer discovery, trusted Lockdown and service checks still have to pass.\n        let connectionMode = await getConnectionMode()\n        let hasNetwork = self.network.isWifiSatisfied ||\n            (connectionMode == .localVPN && self.network.isCellularSatisfied && self.network.isUTunAvailable)\n        if withNetworkCheck && !hasNetwork {\n            debugLog("[minimuxer] minimuxer not ready: no supported network path")\n            return .failure(.noConnection("No Wi-Fi or cellular VPN path satisfied"))\n        }\n\n        // check connection mode')
          replace_once('Dependencies/minimuxer/Sources/Services/NetworkObserverService.swift', '    var isWiredSatisfied: Bool {', '    var isCellularSatisfied: Bool {\n        let path = monitor.currentPath\n        return path.status == .satisfied && path.usesInterfaceType(.cellular)\n    }\n\n    var isWiredSatisfied: Bool {')
          print("Profile repair: checked TLS, bounded Marco/Polo lease, read-only preflight, cellular VPN eligibility")
          Path("build").mkdir(exist_ok=True)
          import subprocess
          harness_header = 'import Foundation\n\nstruct ResultCode: Equatable { let rawValue: Int32 }\nlet LOCKDOWN_E_SUCCESS = ResultCode(rawValue: 0)\nlet IDEVICE_E_SUCCESS = ResultCode(rawValue: 0)\ntypealias idevice_t = OpaquePointer\ntypealias lockdownd_client_t = OpaquePointer\ntypealias idevice_connection_t = OpaquePointer\nstruct ServiceDescriptor { var port: UInt16; var ssl_enabled: UInt8 }\ntypealias lockdownd_service_descriptor_t = UnsafeMutablePointer<ServiceDescriptor>\nenum PairingMode { case lockdown, rppairing }\nenum DeviceService { case misagent }\nenum ErrorCode { case serviceError, connectionFailed }\nstruct LibimobiledeviceGatewayError: Error { let reason: String; init(_ code: ErrorCode, reason: String) { self.reason = reason } }\n\nfinal class FakeConnection {\n    let name: String\n    var incoming = Data()\n    var outgoing = Data()\n    var closed = false\n    init(_ name: String) { self.name = name }\n}\nvar mode = "success"\nvar connections: [Int: FakeConnection] = [:]\nvar events: [String] = []\nvar parentOpen = false\nvar installed = false\nvar nextID = 100\nfunc framed(_ plist: [String: Any]) -> Data {\n    let payload = try! PropertyListSerialization.data(fromPropertyList: plist, format: .xml, options: 0)\n    var n = UInt32(payload.count).bigEndian\n    var data = withUnsafeBytes(of: &n) { Data($0) }\n    data.append(payload)\n    return data\n}\nfunc lockdownd_start_service(_ client: lockdownd_client_t?, _ name: String, _ out: UnsafeMutablePointer<lockdownd_service_descriptor_t?>) -> ResultCode {\n    precondition(parentOpen)\n    let descriptor = lockdownd_service_descriptor_t.allocate(capacity: 1)\n    descriptor.initialize(to: ServiceDescriptor(port: name.hasSuffix("heartbeat") ? 1 : 2, ssl_enabled: 1))\n    out.pointee = descriptor\n    events.append("start:" + name)\n    return LOCKDOWN_E_SUCCESS\n}\nfunc lockdownd_start_service_with_escrow_bag(_ client: lockdownd_client_t?, _ name: String, _ out: UnsafeMutablePointer<lockdownd_service_descriptor_t?>) -> ResultCode {\n    events.append("escrow:" + name)\n    return lockdownd_start_service(client, name, out)\n}\nfunc lockdownd_service_descriptor_free(_ d: lockdownd_service_descriptor_t) { d.deinitialize(count: 1); d.deallocate() }\nfunc idevice_connect(_ device: idevice_t, _ port: UInt16, _ out: UnsafeMutablePointer<idevice_connection_t?>) -> ResultCode {\n    nextID += 1\n    let conn = FakeConnection(port == 1 ? "heartbeat" : "misagent")\n    if port == 1 { conn.incoming = framed(["Command": mode == "wrong-marco" ? "Pico" : "Marco", "Interval": 10]) }\n    connections[nextID] = conn\n    out.pointee = OpaquePointer(bitPattern: nextID)\n    return IDEVICE_E_SUCCESS\n}\nfunc idevice_connection_enable_ssl(_ c: idevice_connection_t) -> ResultCode {\n    let name = connections[Int(bitPattern: c)]!.name\n    events.append("tls:" + name)\n    return ResultCode(rawValue: mode == "tls-fail" && name == "misagent" ? -6 : 0)\n}\nfunc idevice_disconnect(_ c: idevice_connection_t) -> ResultCode {\n    let conn = connections[Int(bitPattern: c)]!\n    conn.closed = true\n    events.append("close:" + conn.name)\n    return IDEVICE_E_SUCCESS\n}\nfunc idevice_connection_send(_ c: idevice_connection_t, _ ptr: UnsafePointer<CChar>, _ length: UInt32, _ sent: UnsafeMutablePointer<UInt32>) -> ResultCode {\n    let conn = connections[Int(bitPattern: c)]!\n    precondition(parentOpen && !conn.closed)\n    let count = min(Int(length), 7) // Force partial writes across header and payload.\n    conn.outgoing.append(Data(bytes: ptr, count: count))\n    sent.pointee = UInt32(count)\n    if conn.outgoing.count >= 4 {\n        let n = conn.outgoing.prefix(4).reduce(UInt32(0)) { ($0 << 8) | UInt32($1) }\n        if conn.outgoing.count == Int(n) + 4 {\n            let p = try! PropertyListSerialization.propertyList(from: conn.outgoing.dropFirst(4), options: [], format: nil) as! [String: Any]\n            conn.outgoing.removeAll()\n            if conn.name == "heartbeat" {\n                precondition(p["Command"] as? String == "Polo")\n                events.append("Polo")\n            } else if p["MessageType"] as? String == "CopyAll" {\n                precondition(events.contains("Polo"))\n                events.append("CopyAll")\n                if mode == "eof" { /* close without a response */ }\n                else if mode == "oversize" { conn.incoming = Data([0x7f, 0xff, 0xff, 0xff]) }\n                else if mode == "missing-payload" { conn.incoming = framed(["Status": 0]) }\n                else { conn.incoming = framed(["Status": 0, "Payload": [Data([1, 2])]]) }\n            } else {\n                precondition(p["MessageType"] as? String == "Install")\n                precondition(p["ProfileType"] as? String == "Provisioning")\n                precondition(p["Profile"] as? Data == Data([7, 8, 9]))\n                precondition(events.contains("CopyAll"))\n                precondition(connections.values.contains { $0.name == "heartbeat" && !$0.closed })\n                installed = true\n                events.append("Install")\n                conn.incoming = framed(["Status": mode == "status-error" ? -402620383 : 0])\n            }\n        }\n    }\n    return IDEVICE_E_SUCCESS\n}\nfunc idevice_connection_receive_timeout(_ c: idevice_connection_t, _ ptr: UnsafeMutablePointer<CChar>, _ length: UInt32, _ received: UnsafeMutablePointer<UInt32>, _ timeout: UInt32) -> ResultCode {\n    let conn = connections[Int(bitPattern: c)]!\n    precondition(parentOpen && !conn.closed && timeout > 0)\n    guard !conn.incoming.isEmpty else { received.pointee = 0; return ResultCode(rawValue: -6) }\n    let count = min(Int(length), min(3, conn.incoming.count)) // Force fragmented reads.\n    conn.incoming.prefix(count).withUnsafeBytes { src in ptr.update(from: src.baseAddress!.assumingMemoryBound(to: CChar.self), count: count) }\n    conn.incoming.removeFirst(count)\n    received.pointee = UInt32(count)\n    return IDEVICE_E_SUCCESS\n}\nfunc debugLog(_ message: String) { }\n\nfinal class TestGateway {\n    var pairingFileType = PairingMode.lockdown\n    var pairingDataDict: [String: Any]? = ["EscrowBag": Data([1])]\n    func withLockdown<T>(_ body: (idevice_t, lockdownd_client_t) throws -> T) throws -> T {\n        parentOpen = true\n        defer { parentOpen = false }\n        return try body(OpaquePointer(bitPattern: 1)!, OpaquePointer(bitPattern: 2)!)\n    }\n    func withRSDService(_ service: DeviceService, _ body: (Int) throws -> Void) throws { fatalError("RSD is outside these Lockdown tests") }\n    func rsdSendPlist(_ stream: Int, dict: [String: Any]) throws { }\n    func rsdRecvPlist(_ stream: Int) throws -> [String: Any] { [:] }\n'
          harness_footer = '}\n\nlet scenarios: [(String, Bool, String?)] = [\n    ("success", true, nil),\n    ("tls-fail", false, "TLS handshake failed"),\n    ("wrong-marco", false, "expected Marco"),\n    ("eof", false, "header receive failed"),\n    ("oversize", false, "invalid response frame length"),\n    ("missing-payload", false, "missing profile array"),\n    ("status-error", true, "device returned status -402620383"),\n]\nfor (scenario, expectInstall, expectError) in scenarios {\n    mode = scenario; connections = [:]; events = []; installed = false\n    do {\n        try TestGateway().syncInstallProvisioningProfile(profile: Data([7, 8, 9]))\n        precondition(expectError == nil, "Expected an error: " + scenario)\n    } catch let error as LibimobiledeviceGatewayError {\n        precondition(expectError != nil && error.reason.contains(expectError!), "Wrong error: " + scenario + ": " + error.reason)\n    } catch { fatalError("Unexpected error: \\(error)") }\n    precondition(installed == expectInstall, "Installation guard failed: " + scenario)\n    precondition(!parentOpen && connections.values.allSatisfy { $0.closed }, "Connection leaked: " + scenario)\n    if scenario == "success" { precondition(events.contains("escrow:com.apple.misagent")) }\n    print("PASS " + scenario)\n}\nprint("7 protocol checks passed using the exact patched Swift implementation")\n'
          gateway_source = Path("Dependencies/minimuxer/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift").read_text()
          protocol_implementation = gateway_source[gateway_source.index("    // Lockdown compatibility path."):gateway_source.index("    func syncRemoveProvisioningProfile(id: String) throws {")]
          Path("build/protocol-harness.swift").write_text(harness_header + protocol_implementation + harness_footer)
          subprocess.run(["xcrun", "swiftc", "-swift-version", "5", "build/protocol-harness.swift", "-o", "build/protocol-harness"], check=True)
          subprocess.run(["build/protocol-harness"], check=True)
          with open("build/personal-test.patch", "w") as out:
              subprocess.run(["git", "diff"], stdout=out, check=True)
              subprocess.run(["git", "-C", "Dependencies/minimuxer", "diff"], stdout=out, check=True)

      - name: Cache public compiler dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: sidestore-d97-xcode26.4-cgateway-v2

      - name: Compile unsigned device archive
        shell: bash
        run: |
          set -o pipefail
          make -B build MARKETING_VERSION=0.7.0-cgateway.3 2>&1 | tee build/compiler.log | xcbeautify --renderer github-actions

      - name: Verify C gateway symbols and package
        shell: bash
        run: |
          set -euo pipefail
          APP=SideStore.xcarchive/Products/Applications/SideStore.app
          DSYM=SideStore.xcarchive/dSYMs/SideStore.app.dSYM/Contents/Resources/DWARF/SideStore
          xcrun nm -arch arm64 -U "$DSYM" > build/symbols.txt
          grep -E ' _idevice_(new|new_with_options|free|new_tcp_socket)$| _lockdownd_client_(free|new_with_handshake)$' build/symbols.txt
          grep -q ' _idevice_new_with_options$' build/symbols.txt
          grep -q ' _lockdownd_client_new_with_handshake$' build/symbols.txt
          if grep -q ' _idevice_new_tcp_socket$' build/symbols.txt; then
            echo "Rust IDevice unexpectedly remains linked"
            exit 1
          fi
          make fakesign ipa
          mkdir -p dist
          cp SideStore.ipa dist/SideStore-CGateway-test.ipa
          shasum -a 256 dist/SideStore-CGateway-test.ipa > dist/SHA256SUMS.txt
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          path = Path("SideStore.xcarchive/Products/Applications/SideStore.app/Info.plist")
          info = plistlib.loads(path.read_bytes())
          result = {
              "upstream_commit": "d97ec133719d79916675bdaf722b82a8d091d545",
              "gateway": "libimobiledevice",
              "rust_gateway_linked": False,
              "version": info["CFBundleShortVersionString"],
              "bundle_identifier": info["CFBundleIdentifier"],
              "minimum_os": info["MinimumOSVersion"],
              "device_renewal_verified": False,
          }
          Path("dist/build-verification.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-CGateway-test
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-CGateway-build-log
          path: |
            build/compiler.log
            build/personal-test.patch
            build/symbols.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload matching app debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-CGateway-dSYMs
          path: SideStore.xcarchive/dSYMs/SideStore.app.dSYM
          if-no-files-found: error
          retention-days: 7
